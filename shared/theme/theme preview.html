<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEAD SIGNAL | Theme Preview</title>
  <link rel="stylesheet" href="dead-signal-theme.css">
</head>
<body class="ds-app">
  <main class="ds-shell">
    <header class="ds-topbar">
      <div>
        <div class="ds-eyebrow">Sublevel B2 // Communications</div>
        <h1 class="ds-brand">DEAD <span>SIGNAL</span></h1>
      </div>
      <div class="ds-live">LOCKDOWN ACTIVE</div>
    </header>
    <section class="ds-panel">
      <div class="ds-hazard"></div>
      <div class="ds-screen">
        <div class="ds-screen-head">
          <span>◉ TERMINAL 02 / MAINTENANCE</span>
          <span class="ds-alert-text">● SYSTEM FAULT</span>
        </div>
        <div class="ds-theme-sample">
          <span class="ds-eyebrow">Puzzle display area</span>
          <h2>SYSTEM OFFLINE</h2>
          <p class="ds-subtle">Each teammate builds their own game in this space.</p>
        </div>
      </div>
      <div class="ds-stats">
        <div class="ds-stat"><div class="ds-stat-label">Progress</div><div class="ds-stat-value">0 / 8</div></div>
        <div class="ds-stat"><div class="ds-stat-label">Misses left</div><div class="ds-stat-value ds-stat-value--red">3</div></div>
        <div class="ds-stat"><div class="ds-stat-label">System</div><div class="ds-stat-value">OFF</div></div>
      </div>
      <div class="ds-controls">
        <button class="ds-button ds-button--red" type="button">RED CHANNEL<small>A</small></button>
        <button class="ds-button ds-button--blue" type="button">BLUE CHANNEL<small>D</small></button>
      </div>
      <p class="ds-message">AWAITING TECHNICIAN</p>
    </section>
    <p class="ds-footer">DEAD SIGNAL // SHARED THEME</p>
  </main>
</body>
</html>
