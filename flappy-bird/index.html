<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G1 dev harness</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%235cff9d'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #04070a;
        --panel: #0b1210;
        --line: rgba(92, 255, 157, 0.25);
        --text: #b8f5cf;
        --dim: rgba(184, 245, 207, 0.6);
        --green: #5cff9d;
        --amber: #ffb347;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        min-height: 100vh;
      }
      h1 { font-size: 14px; letter-spacing: 0.12em; margin: 0; color: var(--dim); }
      #minigame-root {
        width: min(100%, 360px);
        aspect-ratio: 2 / 3;
        border: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .controls { display: flex; gap: 12px; width: min(100%, 360px); }
      .controls button {
        flex: 1;
        padding: 14px 8px;
        font: inherit;
        font-weight: bold;
        color: var(--green);
        background: #0e1a14;
        border: 1px solid var(--line);
        cursor: pointer;
      }
      .controls button:active { background: #163a28; }
      #btn-new {
        font: inherit;
        padding: 8px 12px;
        color: var(--amber);
        background: transparent;
        border: 1px solid rgba(255, 179, 71, 0.4);
        cursor: pointer;
      }
      #status { font-size: 12px; color: var(--dim); text-align: center; max-width: 360px; }
      #status.done { color: var(--green); }
      .hint { font-size: 11px; color: var(--dim); }
      #log {
        width: min(100%, 360px);
        max-height: 180px;
        overflow: auto;
        font-size: 11px;
        color: var(--dim);
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>G1 — SIGNAL PULSE — DEV HARNESS</h1>
    <div id="minigame-root"></div>
    <div class="controls">
      <button id="btn-left" type="button">LEFT</button>
      <button id="btn-right" type="button">RIGHT</button>
    </div>
    <div class="hint">Keyboard: ArrowLeft / A → LEFT, ArrowRight / D → RIGHT</div>
    <button id="btn-new" type="button">New instance (dispose + recreate)</button>
    <div id="status"></div>
    <div id="log"></div>
    <script type="module" src="/src/harness.ts"></script>
  </body>
</html>
