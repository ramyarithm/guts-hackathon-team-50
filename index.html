<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Please Hold</title>
  </head>
  <body>
    <div id="app">
      <!-- Full-screen bunker background -->
      <div id="scene-bg"></div>

      <!-- Debug overlay (top) -->
      <header id="header">
        <h1>Please Hold</h1>
        <div id="debug-panel">
          <span class="debug-label">Debug:</span>
          <div id="debug-games"></div>
          <span class="debug-label">PIN:</span>
          <span id="debug-pin" class="debug-pin">----</span>
        </div>
      </header>

      <!-- Phone screen area - positioned over the phone in the background -->
      <div id="phone-container">
        <!-- Lives display -->
        <div id="lives-display">
          <span class="lives-label">LIVES:</span>
          <span id="lives-count">3</span>
        </div>

        <!-- Stage progress indicator -->
        <nav id="stage-nav">
          <div class="stage" data-stage="C1"><span class="stage-num">1</span><span class="stage-digit">?</span></div>
          <div class="stage" data-stage="C2"><span class="stage-num">2</span><span class="stage-digit">?</span></div>
          <div class="stage" data-stage="C3"><span class="stage-num">3</span><span class="stage-digit">?</span></div>
          <div class="stage" data-stage="C4"><span class="stage-num">4</span><span class="stage-digit">?</span></div>
        </nav>

        <!-- Phone frame -->
        <div id="phone-frame">
          <!-- Game canvas -->
          <div id="minigame-root"></div>

          <!-- Control buttons inside phone -->
          <div id="controls">
            <button id="btn-left" type="button" class="control-btn">
              <span class="label">Left</span>
              <span class="key-hint">A</span>
            </button>
            <button id="btn-right" type="button" class="control-btn">
              <span class="label">Right</span>
              <span class="key-hint">D</span>
            </button>
            <button id="btn-single" type="button" class="control-btn control-btn--single">
              <span class="label">Action</span>
              <span class="key-hint">S</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Game Over overlay -->
      <div id="game-over-overlay" class="overlay hidden">
        <div class="overlay-content">
          <h2 class="overlay-title">GAME OVER</h2>
          <p class="overlay-message">The signal has been lost.</p>
          <div class="overlay-buttons">
            <button id="btn-restart" type="button" class="overlay-btn">
              <span class="overlay-btn-label">RESTART</span>
              <span class="overlay-btn-key">A</span>
            </button>
            <button id="btn-menu" type="button" class="overlay-btn overlay-btn--secondary">
              <span class="overlay-btn-label">MAIN MENU</span>
              <span class="overlay-btn-key">D</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
